<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;h1&gt; &lt;/h1&gt;</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div>
        <h1>&lt;h1&gt; &lt;/h1&gt;</h1>
        <h2>h1 — The heading of the page</h2>

        <br>
        <ul>
            <li>
                <h3>Example of h1 usage.</h3>
            </li>
        </ul>


        <div class="ex1-card">

            <div class="ex1-code">
                <div class="code-type">
                    <h4>HTML</h4>
                </div>
                <p>&lt;h1&gt; Heading &lt;/h1&gt;</p>
            </div>

            <p>This is an example of an h1 element.</p>
            <p>The result is a large, bold heading.</p>

            <div class="ex1-result">
                <div class="circles">
                    <div class="circle1"></div>
                    <div class="circle2"></div>
                    <div class="circle3"></div>
                </div>
                <h1>Heading</h1>
            </div>

        </div>
        <img src="../images/h1_images/ex1.png" alt="Example of an h1 element" width="300px" height="100px">


    </div>
</body>

</html>
